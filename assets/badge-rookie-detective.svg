<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="rookieGold" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff5b8"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="rookieDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111c30"/>
      <stop offset="100%" stop-color="#060a12"/>
    </radialGradient>
    <filter id="glowRookie">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <polygon points="100,10 125,60 180,68 140,108 150,165 100,138 50,165 60,108 20,68 75,60" fill="url(#rookieDark)" stroke="url(#rookieGold)" stroke-width="3" filter="url(#glowRookie)"/>

  <circle cx="100" cy="98" r="46" fill="#090f1a" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="4,3"/>

  <circle cx="94" cy="92" r="18" fill="none" stroke="url(#rookieGold)" stroke-width="3.5"/>
  <line x1="107" y1="105" x2="124" y2="122" stroke="url(#rookieGold)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="94" cy="92" r="6" fill="#00f3ff" opacity="0.6"/>

  <line x1="94" y1="70" x2="94" y2="76" stroke="#00f3ff" stroke-width="1.5"/>
  <line x1="94" y1="108" x2="94" y2="114" stroke="#00f3ff" stroke-width="1.5"/>
  <line x1="72" y1="92" x2="78" y2="92" stroke="#00f3ff" stroke-width="1.5"/>
  <line x1="110" y1="92" x2="116" y2="92" stroke="#00f3ff" stroke-width="1.5"/>

  <rect x="30" y="152" width="140" height="24" rx="4" fill="#0c1628" stroke="url(#rookieGold)" stroke-width="1.5"/>
  <text x="100" y="168" font-family="'Orbitron', sans-serif" font-size="10" font-weight="900" fill="#f59e0b" text-anchor="middle" letter-spacing="2">ROOKIE DETECTIVE</text>
</svg>
