      <stop offset="35%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#4a3500"/>
    </radialGradient>
    <radialGradient id="badgeCore" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e2338"/>
      <stop offset="80%" stop-color="#050a12"/>
