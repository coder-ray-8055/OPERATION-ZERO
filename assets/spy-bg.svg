<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="65%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e1d35" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#080c16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#03050a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="agentGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#152238" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#03060c" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="tacticalGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00f3ff" stroke-width="0.35" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="1.5" fill="#00f3ff" fill-opacity="0.25"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGlow)"/>

  <rect width="100%" height="100%" fill="url(#tacticalGrid)"/>

  <g opacity="0.15" fill="#00f3ff">

    <circle cx="500" cy="340" r="4" filter="url(#glow)"/>
    <circle cx="850" cy="280" r="4" filter="url(#glow)"/>
    <circle cx="1180" cy="420" r="4" filter="url(#glow)"/>
    <circle cx="1400" cy="300" r="4" filter="url(#glow)"/>
    <circle cx="680" cy="620" r="3"/>
    <circle cx="1250" cy="700" r="3"/>
    <line x1="500" y1="340" x2="850" y2="280" stroke="#00f3ff" stroke-width="0.8" stroke-dasharray="4,4"/>
    <line x1="850" y1="280" x2="1180" y2="420" stroke="#00f3ff" stroke-width="0.8" stroke-dasharray="4,4"/>
    <line x1="1180" y1="420" x2="1400" y2="300" stroke="#00f3ff" stroke-width="0.8" stroke-dasharray="4,4"/>
  </g>

  <g transform="translate(1420, 500)" opacity="0.2">
    <circle cx="0" cy="0" r="380" fill="none" stroke="#00f3ff" stroke-width="1" stroke-dasharray="6,8"/>
    <circle cx="0" cy="0" r="280" fill="none" stroke="#00f3ff" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="180" fill="none" stroke="#00f3ff" stroke-width="0.8" stroke-dasharray="4,4"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ff3366" stroke-width="1.5"/>
    <line x1="-420" y1="0" x2="420" y2="0" stroke="#00f3ff" stroke-width="0.5"/>
    <line x1="0" y1="-420" x2="0" y2="420" stroke="#00f3ff" stroke-width="0.5"/>
  </g>

  <g transform="translate(1200, 200)" opacity="0.65">

    <ellipse cx="220" cy="350" rx="200" ry="320" fill="#00f3ff" opacity="0.08" filter="url(#glow)"/>

    <path d="M 120 480 C 120 420, 160 380, 190 370 C 170 340, 165 310, 175 270 C 180 240, 200 220, 235 220 C 270 220, 290 240, 295 270 C 305 310, 300 340, 280 370 C 310 380, 350 420, 350 480 L 400 900 L 70 900 Z" fill="url(#agentGradient)"/>

    <path d="M 160 270 C 160 210, 200 170, 240 170 C 280 170, 320 210, 320 270 C 290 280, 270 270, 240 270 C 210 270, 190 280, 160 270 Z" fill="#080e1a"/>

    <path d="M 150 250 Q 240 230 330 250 Q 240 260 150 250" fill="#00f3ff" opacity="0.4" filter="url(#glow)"/>

    <circle cx="285" cy="275" r="3" fill="#ff3366" filter="url(#glow)"/>
    <path d="M 285 278 L 295 320" stroke="#ff3366" stroke-width="1.2" opacity="0.6"/>
  </g>

  <g stroke="#00f3ff" stroke-width="1.5" opacity="0.4" fill="none">

    <path d="M 40 70 L 40 40 L 70 40"/>

    <path d="M 1850 40 L 1880 40 L 1880 70"/>

    <path d="M 40 1010 L 40 1040 L 70 1040"/>

    <path d="M 1850 1040 L 1880 1040 L 1880 1010"/>
  </g>

  <line x1="0" y1="80" x2="1920" y2="80" stroke="#00f3ff" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="1000" x2="1920" y2="1000" stroke="#00f3ff" stroke-width="0.5" opacity="0.15"/>
</svg>
